<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我們的宇宙大戰爭 - Cosmic War</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- 背景星空 -->
  <canvas id="starfield"></canvas>

  <!-- 質感浮動提示框 -->
  <div id="toast-notification">敬請期待</div>

  <!-- ==========================================
       VIEW 1: 主選單
       ========================================== -->
  <div class="view-container" id="home-view">
    
    <!-- 整合 3D 星球與粒子環遮蔽的 Canvas 舞台 -->
    <div class="epic-planet-stage">
      <canvas id="epic-planet-canvas"></canvas>
    </div>

    <div class="title-group">
      <div class="main-title-text">我們的宇宙大戰爭</div>
      <div class="sub-title-text">OUR COSMIC WAR</div>
    </div>

    <div class="menu-center-list">
      <div class="menu-btn primary" id="start-game-btn">
        <div class="menu-btn-text"><span class="zh">開始遊戲</span></div>
      </div>
      <div class="menu-btn" id="instructions-btn">
        <div class="menu-btn-text"><span class="zh">操作說明</span></div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       VIEW 2: 宇宙星系地圖
       ========================================== -->
  <div class="view-container hidden" id="map-view">
    <div class="map-header">
      <button class="back-btn" id="back-to-home-btn">◄ 返回主選單</button>
      <h2 style="letter-spacing: 3px; font-size: 26px; text-shadow: 0 0 10px rgba(255,255,255,0.5);">選擇探索星球</h2>
    </div>

    <div class="planets-stage">
      <div class="planet-node p-1" id="planet-mushroom">
        <div class="planet-sphere"></div>
        <div class="planet-label">蘑菇星</div>
      </div>
      <div class="planet-node p-2" onclick="showToast('機械星航道尚未開啟，敬請期待！')">
        <div class="planet-sphere"></div>
        <div class="planet-label">機械星</div>
      </div>
      <div class="planet-node p-3" onclick="showToast('冰璃星區域正在建構中，敬請期待！')">
        <div class="planet-sphere"></div>
        <div class="planet-label">冰璃星</div>
      </div>
      <div class="planet-node p-4" onclick="showToast('幽穹星氣場異變中，敬請期待！')">
        <div class="planet-sphere"></div>
        <div class="planet-label">幽穹星</div>
      </div>
      <div class="planet-node p-5" onclick="showToast('魔界星防禦網未解除，敬請期待！')">
        <div class="planet-sphere"></div>
        <div class="planet-label">魔界星</div>
      </div>
    </div>
  </div>

  <!-- 蘑菇星關卡選單 Modal -->
  <div class="modal-overlay" id="stage-modal">
    <div class="modal-card">
      <div class="modal-title">🍄 蘑菇星 - 選擇關卡</div>
      <div class="stage-list">
        <div class="stage-item" onclick="location.href='main.html'">1-1 夢開始的起點</div>
        <div class="stage-item" onclick="showToast('關卡 1-2 正在開發中，敬請期待！')">1-2 最真實的幻境</div>
        <div class="stage-item" onclick="showToast('關卡 1-3 決戰即將來臨，敬請期待！')">1-3 在虛空決一死戰！</div>
      </div>
      <button class="modal-close-btn" id="close-stage-modal">關閉</button>
    </div>
  </div>

  <!-- 操作說明 Modal -->
  <div class="modal-overlay" id="info-modal">
    <div class="modal-card">
      <div class="modal-title">🎮 操作說明</div>
      <div style="color: #ddd; line-height: 1.8; text-align: center; margin-bottom: 20px;">
        1. 使用滑鼠點擊選擇目標與行動策略。<br>
        2. 解答數學計算題目發動隊伍技能攻擊。<br>
        3. 擊潰所有敵方單位拯救破碎的宇宙星系！
      </div>
      <button class="modal-close-btn" id="close-info-modal">明白</button>
    </div>
  </div>

  <script>
    // 1. 背景星空動畫
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < 300; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.8 + 0.3,
          alpha: Math.random(),
          speed: Math.random() * 0.015 + 0.003
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.fill();
      });
      requestAnimationFrame(animateStars);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateStars();

    // 2. 3D 完美遮蔽星球與顆粒土星環系統
    const planetCanvas = document.getElementById('epic-planet-canvas');
    const pCtx = planetCanvas.getContext('2d');
    planetCanvas.width = 700;
    planetCanvas.height = 700;

    const planetRadius = 130;
    let particles = [];
    const numParticles = 600;

    for (let i = 0; i < numParticles; i++) {
      let radius = 150 + Math.random() * 140;
      particles.push({
        radius: radius,
        angle: Math.random() * Math.PI * 2,
        speed: 0.0025 + (1 - (radius - 150) / 140) * 0.0035,
        size: Math.random() * 2.2 + 0.6,
        yOffset: (Math.random() - 0.5) * 16,
        color: Math.random() > 0.4 ? 'rgba(216, 180, 254,' : (Math.random() > 0.5 ? 'rgba(56, 189, 248,' : 'rgba(255, 255, 255,')
      });
    }

    function renderEpicPlanet() {
      pCtx.clearRect(0, 0, planetCanvas.width, planetCanvas.height);

      const centerX = planetCanvas.width / 2;
      const centerY = planetCanvas.height / 2;
      const tiltX = 0.38;

      particles.forEach(p => {
        p.angle += p.speed;
        p.x3d = Math.cos(p.angle) * p.radius;
        p.z3d = Math.sin(p.angle) * p.radius;
        p.screenX = centerX + p.x3d;
        p.screenY = centerY + (p.z3d * tiltX) + p.yOffset;
      });

      // 後方粒子
      particles.filter(p => p.z3d < 0).forEach(p => {
        let depthFactor = (p.z3d + 290) / 580;
        let alpha = 0.1 + depthFactor * 0.6;
        let size = p.size * 0.9;

        pCtx.beginPath();
        pCtx.arc(p.screenX, p.screenY, size, 0, Math.PI * 2);
        pCtx.fillStyle = p.color + alpha + ')';
        pCtx.fill();
      });

      // 星球大氣層光暈
      let atmosGradient = pCtx.createRadialGradient(centerX, centerY, planetRadius * 0.8, centerX, centerY, planetRadius * 1.3);
      atmosGradient.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
      atmosGradient.addColorStop(1, 'rgba(56, 189, 248, 0)');
      pCtx.beginPath();
      pCtx.arc(centerX, centerY, planetRadius * 1.3, 0, Math.PI * 2);
      pCtx.fillStyle = atmosGradient;
      pCtx.fill();

      // 星球核心本體
      let planetGradient = pCtx.createRadialGradient(centerX - 45, centerY - 45, 20, centerX, centerY, planetRadius);
      planetGradient.addColorStop(0, '#38bdf8');
      planetGradient.addColorStop(0.35, '#0284c7');
      planetGradient.addColorStop(0.75, '#0f172a');
      planetGradient.addColorStop(1, '#020617');

      pCtx.beginPath();
      pCtx.arc(centerX, centerY, planetRadius, 0, Math.PI * 2);
      pCtx.fillStyle = planetGradient;
      pCtx.fill();

      // 星球立體陰影
      let shadowGradient = pCtx.createRadialGradient(centerX + 35, centerY + 35, 20, centerX, centerY, planetRadius);
      shadowGradient.addColorStop(0, 'rgba(0, 0, 0, 0.85)');
      shadowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      pCtx.beginPath();
      pCtx.arc(centerX, centerY, planetRadius, 0, Math.PI * 2);
      pCtx.fillStyle = shadowGradient;
      pCtx.fill();

      // 前方粒子
      particles.filter(p => p.z3d >= 0).forEach(p => {
        let depthFactor = (p.z3d + 290) / 580;
        let alpha = 0.3 + depthFactor * 0.7;
        let size = p.size * 1.1;

        pCtx.beginPath();
        pCtx.arc(p.screenX, p.screenY, size, 0, Math.PI * 2);
        pCtx.fillStyle = p.color + alpha + ')';
        pCtx.fill();
      });

      requestAnimationFrame(renderEpicPlanet);
    }
    renderEpicPlanet();

    // 3. 視圖與彈窗切換邏輯
    const homeView = document.getElementById('home-view');
    const mapView = document.getElementById('map-view');
    document.getElementById('start-game-btn').addEventListener('click', () => {
      homeView.classList.add('hidden');
      mapView.classList.remove('hidden');
    });
    document.getElementById('back-to-home-btn').addEventListener('click', () => {
      mapView.classList.add('hidden');
      homeView.classList.remove('hidden');
    });

    const stageModal = document.getElementById('stage-modal');
    document.getElementById('planet-mushroom').addEventListener('click', () => stageModal.classList.add('active'));
    document.getElementById('close-stage-modal').addEventListener('click', () => stageModal.classList.remove('active'));

    const infoModal = document.getElementById('info-modal');
    document.getElementById('instructions-btn').addEventListener('click', () => infoModal.classList.add('active'));
    document.getElementById('close-info-modal').addEventListener('click', () => infoModal.classList.remove('active'));

    // 4. 自訂美觀的 Toast 提示框函式（取代原先醜醜的 alert）
    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toast-notification');
      toast.textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
  </script>
</body>
</html>
